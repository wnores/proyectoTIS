<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Comprobante de adquisición de un curso.">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="styles/estilos.css">

    <title>Cursos CC | Comprobante de compra</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav
            class="navbar navbar-expand-lg navbar-dark shadow-sm"
            aria-label="Navegación principal">

            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <img
                        src="recursos/imagenes/logo.jpg"
                        alt="Cursos de Ciencias de la Computación"
                        class="logo">
                </a>

            </div>

        </nav>
    </header>

    <main class="flex-grow-1 py-5">

        <div class="container">

            <div
                id="estadoCarga"
                class="text-center py-5"
                role="status"
                aria-live="polite">

                <div
                    class="spinner-border text-primary"
                    aria-hidden="true">
                                
                </div>

                <p class="mt-3">
                    Cargando comprobante...
                </p>

            </div>

            <section
                id="comprobanteCompra"
                class="card shadow-sm mx-auto d-none"
                style="max-width: 720px;"
                aria-labelledby="tituloComprobante">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <i
                            class="bi bi-check-circle-fill text-success display-4"
                            aria-hidden="true">
                        </i>

                        <h1
                            id="tituloComprobante"
                            class="h3 mt-3">

                            Comprobante de adquisición

                        </h1>

                        <p class="text-muted mb-0">
                            La operación fue registrada correctamente.
                        </p>

                    </div>

                    <hr>

                    <dl class="row mb-0">

                        <dt class="col-sm-5">
                            Número de comprobante:
                        </dt>

                        <dd
                            class="col-sm-7"
                            id="comprobanteNumero">
                        </dd>

                        <dt class="col-sm-5">
                            Curso:
                        </dt>

                        <dd
                            class="col-sm-7"
                            id="comprobanteCurso">
                        </dd>

                        <dt class="col-sm-5">
                            Importe:
                        </dt>

                        <dd
                            class="col-sm-7"
                            id="comprobantePrecio">
                        </dd>

                        <dt class="col-sm-5">
                            Método de pago:
                        </dt>

                        <dd
                            class="col-sm-7"
                            id="comprobanteMetodo">
                        </dd>

                        <dt class="col-sm-5">
                            Fecha:
                        </dt>

                        <dd
                            class="col-sm-7"
                            id="comprobanteFecha">
                        </dd>

                        <dt class="col-sm-5">
                            Estado:
                        </dt>

                        <dd class="col-sm-7">
                            <span
                                id="comprobanteEstado"
                                class="badge">
                            </span>
                        </dd>

                    </dl>

                    <div
                        class="d-flex flex-wrap justify-content-center gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-outline-primary"
                            id="btnImprimirComprobante">

                            <i class="bi bi-printer me-1" aria-hidden="true"></i>
                            Imprimir

                        </button>

                        <a
                            href="misCursos.html"
                            class="btn btn-primary">

                            Ver mis cursos

                        </a>

                    </div>

                </div>

            </section>

            <div
                id="mensajeError"
                class="alert alert-danger d-none mx-auto"
                style="max-width: 720px;"
                role="alert">

                <p id="textoError" class="mb-3"></p>

                <a href="catalogo.html" class="btn btn-primary">
                    Volver al catálogo
                </a>

            </div>

        </div>

    </main>

    <script src="js/comprobanteCompra.js" type="module"></script>

</body>
</html>
