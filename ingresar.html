<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Cursos CC | Ingresar</title>
<style>
       
        /* Tarjeta blanca del formulario */
        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* Inputs con borde negro grueso */
        .form-control {
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 10px 12px;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #000000;
            outline: none;
        }

        /* Círculo del candado */
        .lock-circle {
            width: 100px;
            height: 100px;
            border: 2px solid #000000;
        }
        .lock-circle i {
            font-size: 45px;
        }

        /* Icono de ojo flotando dentro del input */
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
        }

        
        /* Icono de aviso de cookies (círculo negro) */
        .cookie-icon {
            cursor: pointer;
        }
    </style>

    <title>Iniciar sesión</title>
</head>
<body class="d-flex flex-column min-vh-100" data-page="ingresar.html">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="producto" href="acercaDe.html">Acerca De</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="catalogo" href="catalogo.html">Catálogo de cursos</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="beca.html">Becas</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="carrito" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                        <a href="ingresar.html" class="btn btn-outline-light btn-sm logged-out">
                            Ingresar
                        </a>
                </div>
                <div class="d-flex align-items-center gap-2">
                        <a href="ingresar.html" id="logout" class="btn btn-outline-light btn-sm logged-in">
                            Salir
                        </a>
                </div>    
        </div>
    </nav>
   
    <main class='flex-grow-1'>
    <div class="text-left">
    <br>
        <div class="row justify-content-center">
            <!-- Ancho responsivo: Móvil 100%, Tablet 60%, Pantalla grande 35% -->
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="login-card">
                    
                    <!-- Título -->
                    <h2 class="text-center fw-bold mb-4">Inicio de sesión</h2>

                    <!-- Candado central -->
                    <div class="d-flex justify-content-center mb-4">
                        <div class="lock-circle rounded-circle d-flex align-items-center justify-content-center">
                            <i class="bi bi-lock-fill"></i>
                        </div>
                    </div>

                    <form>
                        <!-- Correo -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Dirección de correo</label>
                            <input type="email" class="form-control" placeholder="usuario@correo.com" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase">Contraseña</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-control" id="passwordInput" required>
<i class="bi bi-eye-slash-fill password-toggle" id="togglePassword" style="cursor: pointer;"></i>
                            </div>
                        </div>

                        <!-- Botones Acceder y Registrarme -->
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary flex-grow-1 rounded-10">Acceder</button>
                            <!-- Si tienes la página de registro, cambia '#' por 'registro.html' -->
                            <a href="registrarse.html" class="btn btn-primary flex-grow-1 rounded-10 text-center text-decoration-none">Registrarme <img src="recursos/iconos/registrarse.png" alt="registro"></a>
                        </div>

                        <!-- Recuperar acceso -->
                        <div class="mt-3">
                            <a href="recuperar_password.html" class="text-dark fw-bold text-decoration-none">Recuperar el acceso</a>
                        </div>

                        <!-- Aviso de cookies -->
                        <div class="d-flex align-items-center gap-2 mt-5">
                            <span class="fw-bold">Aviso de cookies</span>
                            <!-- Popover informativo -->
                            <i class="bi bi-info-circle-fill text-dark cookie-icon"
                               role="button"
                               tabindex="0"
                               data-bs-toggle="popover"
                               data-bs-trigger="click"
                               data-bs-container="body"
                               data-bs-placement="right"
                               data-bs-content="Este sitio web utiliza cookies propias y de terceros para mejorar tu experiencia de navegación.">
                            </i>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    <br>
        <a href="index.html" class="btn btn-primary">Volver al inicio <img src="recursos/iconos/atras.png" alt="atrás"></a>
    
    
    </div>
    </main>
    <footer class="footer py-4 w-100">
        <div class="container">
            <p class="mb-2">
                <img src="recursos/iconos/derechosAutor.png" alt="copyrihgt"> 2026 - Taller Integrador de Sistemas
            </p>
        </div>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Activador de Popovers -->
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
            popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl);
            });
        });

        // Funcionalidad de mostrar/ocultar contraseña
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#passwordInput');

        togglePassword.addEventListener('click', function (e) {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye slash icon
            this.classList.toggle('bi-eye-slash-fill');
            this.classList.toggle('bi-eye-fill');
        });

    </script>
</body>
</html>
