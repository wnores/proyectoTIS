<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles/estilos.css">

    <style>
        .register-card { background-color: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .form-control, .form-select { border: 1px solid #444; }
        .form-control:focus, .form-select:focus { box-shadow: none; border-color: #000; }
        .avatar-wrapper { width: 140px; height: 140px; position: relative; }
        .camera-btn { width: 38px; height: 38px; bottom: 0; right: 0; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .btn-outline-custom { border-radius: 50px; border: 1px solid #444; color: #444; padding: 8px 24px; }
        .btn-outline-custom:hover { background-color: #444; color: #fff; }
        
        /* Estilo extra para que el cursor se vuelva una manita al pasar sobre el ícono */
        .info-icon { cursor: pointer; }
    </style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title> - | Registrarse</title>
</head>
<body class="d-flex flex-column min-vh-100" data-page="registrarse.html">
     <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="recursos/imagenes/logo.jpg" alt="Cursos de Ciencias de la Computación" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="producto" href="acercaDe.html">Acerca De</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="catalogo" href="catalogo.html">Catálogo de cursos</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="admin" href="beca.html">Becas</a></li>
                    <li class="nav-item"><a class="nav-link" data-page="carrito" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                        <a href="ingresar.html" class="btn btn-outline-light btn-sm">
                            Ingresar
                        </a>
                </div>  
        </div>
    </nav>
    <main class='flex-grow-1'>
    <div class="text-left">
        <p></p>
        <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <div class="register-card">
                    
                    <h2 class="text-center fw-bold mb-4">Registrarse</h2>

                    <form id="registerForm">
                        <div class="row g-4">
                            
                            <!-- COLUMNA IZQUIERDA -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Apellido <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Dirección de correo <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Departamento <span class="text-danger">*</span></label>
                                    <select class="form-select" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="montevideo">Montevideo</option>
                                        <option value="canelones">Canelones</option>
                                        <option value="maldonado">Maldonado</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">
                                        Contraseña <span class="text-danger">*</span>
                                        <!-- Ícono de información estándar -->
                                       <i class="bi bi-info-circle-fill text-dark ms-1" 
                                           role="button" 
                                           tabindex="0"
                                           data-bs-toggle="popover" 
                                           data-bs-trigger="hover focus click" 
                                           data-bs-container="body"
                                           data-bs-placement="right"
                                           data-bs-content="Debe tener al menos 8 caracteres, incluir mayúscula y un número."></i>
                                    </label>
                                    <input type="password" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Repetir Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" required>
                                </div>

                            </div>

                            <!-- COLUMNA DERECHA -->
                            <div class="col-md-6">
                                
                                <br>
                                <br>

                                <!-- Avatar y cámara (usando solo clases de Bootstrap e iconos) -->
                                <div class="d-flex justify-content-center mb-4">
                                    <div class="avatar-wrapper">
                                        <div class="bg-secondary bg-opacity-10 rounded-circle border border-secondary d-flex align-items-center justify-content-center w-100 h-100">
                                            <i class="bi bi-person-fill text-secondary"></i>
                                        </div>
                                        <!-- Botón cámara flotante -->
                                        <button type="button" class="btn btn-light border border-dark rounded-circle shadow-sm camera-btn position-absolute">
                                            <i class="bi bi-camera-fill text-dark"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Tipo de Documento <span class="text-danger">*</span></label>
                                    <select class="form-select" required>
                                        <option value="" selected disabled>Seleccione...</option>
                                        <option value="ci">Cédula de Identidad (CI)</option>
                                        <option value="pasaporte">Pasaporte</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold small text-uppercase">
                                        Nro Documento <span class="text-danger">*</span>
                                        <!-- Ícono de información estándar -->
                                        <i class="bi bi-info-circle-fill text-dark ms-1 info-icon" 
                                           tabindex="0"
                                           data-bs-toggle="popover" 
                                           data-bs-trigger="click"
                                           data-bs-container="body"
                                           data-bs-placement="right" 
                                           data-bs-content="Ingrese su número sin puntos ni guiones."></i>
                                    </label>
                                    <input type="text" class="form-control" required>
                                </div>

                                <!-- Checkbox de términos -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                    <label class="form-check-label small" for="termsCheck">
                                        Acepto los términos y condiciones de la política de privacidad
                                    </label>
                                </div>

                                <!-- Botón Crear Cuenta -->
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Crear Cuenta</button>
                                <br><br>
                                <a class="btn btn-primary">Registrarse con Google <img src="recursos/iconos/google.png" alt="Registro con Google"></a>
    
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

            <!-- Script para activar los Popovers -->
            <script>
            // Función que inicializa los popovers cuando la página termina de cargar
                document.addEventListener('DOMContentLoaded', function() {
                    const popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
                    popoverTriggerList.map(function (popoverTriggerEl) {
                        return new bootstrap.Popover(popoverTriggerEl);
                    });
                });
            </script>

        </div>
    </main>
    <footer class="footer py-4 w-100">
        <div class="container">
            <p class="mb-2">
                <img src="recursos/iconos/derechosAutor.png" alt="copyrihgt"> 2026 - Taller Integrador de Sistemas
            </p>
        </div>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
